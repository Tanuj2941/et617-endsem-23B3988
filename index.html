<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Pendulum Explorer | ET617</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#e9f0fc;background:#0b1220}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0,#182c49 0,transparent 43%),#0b1220}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:980px;margin:auto;padding:20px 20px 95px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.brand{font-weight:800;font-size:19px;letter-spacing:-.5px}.brand span{color:#69e7c3}.chip{font-size:12px;color:#bcd1e8;border:1px solid #36506a;padding:7px 9px;border-radius:100px}.track{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:20px 0}.track i{height:5px;background:#2c3b53;border-radius:10px}.track i.on{background:#42dcb3}.panel{background:rgba(20,33,54,.94);border:1px solid #30435e;border-radius:22px;padding:27px;box-shadow:0 12px 35px #0002}.kicker{color:#66e5c1;font-size:12px;letter-spacing:1.8px;text-transform:uppercase;font-weight:800}h1{font-size:clamp(28px,4vw,43px);line-height:1.12;letter-spacing:-1.3px;margin:10px 0}h2{font-size:26px;letter-spacing:-.65px;margin:8px 0 15px}h3{font-size:17px;margin:12px 0}p{line-height:1.7;color:#c7d3e3;margin:10px 0}small,.muted{color:#9bb0c7}.lead{font-size:17px;max-width:720px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{background:#101c30;border:1px solid #30435e;padding:18px;border-radius:15px}.box.good{border-color:#2e977e;background:#102c2c}.box.warn{border-color:#b47f39;background:#302519}.buttonrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.btn{border-radius:12px;min-height:47px;padding:12px 18px;border:1px solid #536a84;background:#1c2a41;color:#f1f7ff;font-weight:750}.btn.primary{background:#42dcb3;border-color:#42dcb3;color:#072522}.btn:focus-visible,.option:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #b7ffdc;outline-offset:2px}.stat{font-size:28px;font-weight:850;color:#6ce9cb}.pill{display:inline-block;border:1px solid #3a536d;padding:6px 10px;border-radius:9px;color:#b7cae3;font-size:12px;margin:2px}.options{display:grid;gap:10px;margin:16px 0}.option{text-align:left;padding:15px 17px;background:#111e33;border:1px solid #3b4d68;color:#f1f5fc;border-radius:12px;min-height:50px}.option.selected{border-color:#42dcb3;background:#103631}.feedback{border-left:4px solid #5adbc1;border-radius:8px;background:#102d35;padding:13px 15px;margin:15px 0;color:#d9f7f0;line-height:1.6}.feedback.wrong{border-color:#ffc36a;background:#32291e;color:#ffe4b9}input[type=range]{width:100%;accent-color:#45dcbc;min-height:30px}.ctrl{margin:13px 0}.ctrl label{display:flex;justify-content:space-between;font-weight:650;font-size:14px}.viz{position:relative;height:330px;border-radius:16px;border:1px solid #344b64;background:linear-gradient(#142b43,#101a30);overflow:hidden;display:flex;align-items:center;justify-content:center}.viz svg{height:100%;width:100%}.metric{text-align:center}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.metric .stat{font-size:22px}.question{font-size:17px;font-weight:700;color:#f2f6fe}textarea,input[type=number]{width:100%;border:1px solid #557087;border-radius:12px;background:#0c1a2d;color:#fff;padding:14px;margin:12px 0;min-height:49px}textarea{min-height:85px;resize:vertical}.footer{margin:26px 0;color:#90a6bd;font-size:12px;text-align:center}.banner{font-weight:700;color:#a6f4df}.tag{display:inline-block;color:#0d2b22;background:#9ff1cd;padding:5px 9px;border-radius:8px;font-size:12px;font-weight:750}.hide{display:none}.detail{border-top:1px solid #35465f;margin-top:20px;padding-top:15px}ul{color:#cad5e5;line-height:1.8;padding-left:23px}.stepnote{color:#add5f4;font-size:13px}.bar{height:9px;border-radius:10px;background:#24394e;overflow:hidden;margin:10px 0}.bar b{display:block;height:100%;background:#42dcb3;transition:width .2s}.stickyfoot{display:none}@media(max-width:650px){.wrap{padding:14px 14px 100px}.panel{padding:19px 15px;border-radius:18px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.chip{font-size:10px}.viz{height:270px}.meta{gap:5px}.metric .stat{font-size:18px}.stickyfoot{display:block;position:fixed;bottom:0;left:0;right:0;z-index:5;background:#0b1220ed;border-top:1px solid #30435e;padding:9px 14px max(9px,env(safe-area-inset-bottom));text-align:center;font-size:12px;color:#a3b8cb}.buttonrow .btn{flex:1;min-width:125px}.btn{min-height:52px}.option{min-height:55px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">● Pendulum<span>Explorer</span></div><div class="chip">ET617 · 23B3988 · P5–T1–L5–C3</div></header><div class="track" id="track"></div><main class="panel" id="root" aria-live="polite"></main><div class="footer">Educational virtual lab · Identity: <strong>23B3988</strong> · <button class="btn" style="min-height:30px;padding:5px 10px" onclick="go('about')">About</button></div></div><div class="stickyfoot">23B3988 · Thumb-friendly learning experience</div>
<script>
'use strict';
const ROOT=document.getElementById('root'), TRACK=document.getElementById('track');
const KEY='et617-pendulum-23B3988';
let state={page:'welcome',length:1,mass:100,amplitude:15,prediction:'',result:null,reflection:'',quizIndex:0,quizAnswers:[],feedback:null,logs:[],trials:0,experimentRun:false};
try{const prior=JSON.parse(localStorage.getItem(KEY)||'null');if(prior&&prior.page){state={...state,...prior,page:'welcome',feedback:null}}}catch{}
const pages=['welcome','learn','predict','lab','reflect','quiz'];
function persist(){try{localStorage.setItem(KEY,JSON.stringify({...state,feedback:null}))}catch{}}
function log(event,detail=''){state.logs.push({event,detail,at:new Date().toISOString()});persist()}
function period(L){return 2*Math.PI*Math.sqrt(L/9.81)}
function html(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function step(p){return pages.indexOf(p)}
function render(){TRACK.innerHTML=pages.map((x,i)=>`<i class="${i<=step(state.page)?'on':''}"></i>`).join('');const p=state.page;ROOT.innerHTML=({welcome,learn,predict,lab,reflect,quiz,finish,about}[p]||welcome)();persist();if(p==='lab')startAnimation()}
function go(page){stopAnimation();state.page=page;state.feedback=null;log('view',page);render();window.scrollTo({top:0,behavior:'smooth'})}
function buttons(back,next,label='Continue'){return `<div class="buttonrow">${back?`<button class="btn" onclick="go('${back}')">← Back</button>`:''}${next?`<button class="btn primary" onclick="go('${next}')">${label} →</button>`:''}</div>`}
function welcome(){return `<div class="kicker">Virtual physics lab · Class 9–11</div><h1>Make a prediction.<br>Test it. Learn why.</h1><p class="lead">Explore how a pendulum swings by changing its <b>length, mass and starting angle</b>. There's no penalty for a wrong prediction — that's how experiments work.</p><div class="grid"><div class="box"><span class="tag">Your mission</span><h3>Can you make the swing slower?</h3><p>Experiment with three controls and discover which changes really matter.</p></div><div class="box"><span class="tag">A safe place to retry</span><h3>Small steps, useful hints</h3><p>You'll predict, observe and get a chance to improve your explanation.</p></div></div><div class="buttonrow"><button class="btn primary" onclick="go('learn')">Start exploring →</button>${state.trials?'<button class="btn" onclick="go(\'lab\')">Resume lab</button>':''}</div><p class="stepnote">Six short learning stages · Works on a phone · No sign-in needed</p>`}
function learn(){return `<div class="kicker">1 · Learn</div><h2>What is a simple pendulum?</h2><p>A pendulum is a small weight (bob) suspended from a fixed point by a string. <b>One complete swing back and forth</b> is an oscillation. The time for one oscillation is its <b>period (T)</b>.</p><div class="grid"><div class="box"><h3>What might change T?</h3><ul><li><b>Length (L):</b> distance from support to the centre of the bob</li><li><b>Mass:</b> how heavy the bob is</li><li><b>Amplitude:</b> angle from the vertical at release</li></ul></div><div class="box"><h3>The physics model</h3><p style="font-size:24px;color:#80ebd2"><b>T = 2π√(L/g)</b></p><p>At small angles, with negligible friction, g ≈ 9.81 m/s². The period depends on length, not bob mass. At large angles, this approximation becomes less accurate.</p></div></div><div class="feedback">You don't have to remember the formula yet. First, see what the pendulum actually does.</div>${buttons('welcome','predict','Make a prediction')}`}
function predict(){return `<div class="kicker">2 · Hypothesis</div><h2>Make your first prediction</h2><p class="question">If we make the string longer, what will happen to the time for one swing?</p><div class="options">${[['increase','It will take longer'],['decrease','It will take less time'],['same','It will stay the same']].map(([v,t])=>`<button class="option ${state.prediction===v?'selected':''}" onclick="setPrediction('${v}')">${t}</button>`).join('')}</div><p class="stepnote">This is your hypothesis, not a test. You can revise it after observing.</p><div class="buttonrow"><button class="btn" onclick="go('learn')">← Back</button><button class="btn primary" ${!state.prediction?'disabled':''} onclick="go('lab')">Test my idea →</button></div>`}
function setPrediction(v){state.prediction=v;log('hypothesis',v);render()}
let anim=null;
function startAnimation(){stopAnimation();let start=performance.now();const beam=document.getElementById('pendulum');function frame(t){if(state.page!=='lab'||!beam)return;const seconds=(t-start)/1000;const theta=state.amplitude*Math.sin(seconds*2*Math.PI/period(state.length));beam.setAttribute('transform',`rotate(${theta.toFixed(3)} 180 35)`);anim=requestAnimationFrame(frame)}anim=requestAnimationFrame(frame)}
function stopAnimation(){if(anim){cancelAnimationFrame(anim);anim=null}}
function setParam(k,v){state[k]=Number(v);document.getElementById(k+'Value').textContent=state[k]+({length:' m',mass:' g',amplitude:'°'}[k]);let periodEl=document.getElementById('displayPeriod');if(periodEl)periodEl.textContent=period(state.length).toFixed(2)+' s';let l=document.getElementById('displayLength');if(l)l.textContent=state.length.toFixed(1)+' m';let a=document.getElementById('displayAngle');if(a)a.textContent=state.amplitude+'°';if(k==='length'||k==='mass'){const el=document.getElementById('pendulum');if(el){const line=el.querySelector('line'),bob=el.querySelector('circle');const yy=35+Math.min(215,state.length*140);line.setAttribute('y2',yy);bob.setAttribute('cy',yy);bob.setAttribute('r',10+state.mass/90)}}if(state.result){state.result=null;state.experimentRun=false;document.getElementById('labFeedback').innerHTML='<p class="stepnote">Settings changed. Run the experiment again for a new observation.</p>'}persist()}
function lab(){const r=state.result;return `<div class="kicker">3 · Experiment</div><h2>Your pendulum laboratory</h2><p>Change <b>one variable at a time</b>, run the experiment, and compare your observation with your hypothesis.</p><div class="grid"><div><div class="viz"><svg viewBox="0 0 360 320" role="img" aria-label="Animated pendulum swinging from fixed support"><path d="M80 35H280" stroke="#617d96" stroke-width="8" stroke-linecap="round"/><circle cx="180" cy="35" r="7" fill="#70e7c5"/><path d="M180 35V290" stroke="#36536a" stroke-dasharray="5 5"/><g id="pendulum"><line x1="180" y1="35" x2="180" y2="${35+Math.min(215,state.length*140)}" stroke="#d2e6f6" stroke-width="3"/><circle cx="180" cy="${35+Math.min(215,state.length*140)}" r="${10+state.mass/90}" fill="#52dbb8" stroke="#caffec" stroke-width="2"/></g><text x="15" y="302" fill="#8eabc6" font-size="13">Small-angle model</text></svg></div><div class="meta"><div class="box metric"><small>Period</small><div class="stat" id="displayPeriod">${period(state.length).toFixed(2)} s</div></div><div class="box metric"><small>Length</small><div class="stat" id="displayLength">${state.length.toFixed(1)} m</div></div><div class="box metric"><small>Angle</small><div class="stat" id="displayAngle">${state.amplitude}°</div></div></div></div><div class="box"><h3>Set your variables</h3>${[['length','Length',.3,2,.1],['mass','Mass',50,300,25],['amplitude','Starting angle',5,25,1]].map(([k,label,min,max,inc])=>`<div class="ctrl"><label for="${k}">${label}<span id="${k}Value">${state[k]}${{length:' m',mass:' g',amplitude:'°'}[k]}</span></label><input aria-label="${label}" id="${k}" type="range" min="${min}" max="${max}" step="${inc}" value="${state[k]}" oninput="setParam('${k}',this.value)"></div>`).join('')}<button class="btn primary" style="width:100%" onclick="runTrial()">▶ Run experiment</button><p class="stepnote">Assumes an ideal pendulum and angles ≤ 25°. Mass does not change the ideal period.</p></div></div><div id="labFeedback">${r?trialFeedback(r):'<p class="stepnote">Your result and guided next step will appear here after you run the experiment.</p>'}</div><div class="buttonrow"><button class="btn" onclick="go('predict')">← Prediction</button><button class="btn primary" ${!r?'disabled':''} id="reflectButton" onclick="go('reflect')">Interpret results →</button></div>`}
function runTrial(){const r={T:period(state.length),length:state.length,mass:state.mass,amplitude:state.amplitude,prediction:state.prediction,number:++state.trials};state.result=r;state.experimentRun=true;log('run_experiment',JSON.stringify(r));document.getElementById('labFeedback').innerHTML=trialFeedback(r);document.getElementById('reflectButton').disabled=false;persist()}
function trialFeedback(r){let agree=r.prediction==='increase';return `<div class="box ${agree?'good':'warn'}"><h3>Observation #${r.number}</h3><p>Your pendulum's modeled period is <b>${r.T.toFixed(2)} seconds</b> at ${r.length} m. At 0.5 m, it would be ${period(.5).toFixed(2)} seconds.</p><p>${agree?'Your hypothesis matches the model: longer pendulums take more time to swing.':'Your prediction and the model differ. That is useful evidence! Compare a 0.5 m string and a '+r.length+' m string. Which one needs more time?'}</p><p class="stepnote">Try changing only mass. Does the period number change? Then change only length.</p></div>`}
function reflect(){return `<div class="kicker">4 · Interpret and revise</div><h2>What did your experiment teach you?</h2><p>Your original prediction: <b>${{increase:'Longer string → longer period',decrease:'Longer string → shorter period',same:'Longer string → same period'}[state.prediction]||'Not selected'}</b>.</p><p class="question">Explain in your own words which variable made a difference to the time period and why.</p><textarea id="reflection" placeholder="I noticed that when I increased length...">${html(state.reflection)}</textarea><div class="buttonrow"><button class="btn" onclick="go('lab')">← Try again</button><button class="btn primary" onclick="checkReflection()">Check my reasoning</button></div><div id="reflectFeedback">${state.feedback?state.feedback:''}</div><p class="stepnote">A real AI explanation is attempted when an API key is configured. Otherwise the app clearly shows a recorded-feedback fallback.</p>`}
function checkReflection(){state.reflection=document.getElementById('reflection').value.trim();if(state.reflection.length<12){document.getElementById('reflectFeedback').innerHTML='<div class="feedback wrong">Add one more sentence describing what you changed and observed.</div>';return}log('reflection',state.reflection);let bad=/heav(ier|y)|mass|weight/i.test(state.reflection)&&/fast(er)?|slow(er)?|period|time/i.test(state.reflection)&&!/not|doesn.t|same|no effect|independent/i.test(state.reflection);let correct=/long|length|string/i.test(state.reflection)&&/slow|longer|more time|increas|greater|period/i.test(state.reflection);const fb=bad?'A common idea is that a heavier bob swings faster. But our period equation contains length and gravity, not mass. Keep the length fixed and change the mass: what happens to the displayed period?':correct?'Nice reasoning! In the small-angle model, a longer string increases the period. Changing mass does not change it.':'Good effort. Try completing this observation: “When I increased the length while holding other settings constant, the period ___.”';const klass=correct&&!bad?'feedback':'feedback wrong';document.getElementById('reflectFeedback').innerHTML=`<div class="${klass}"><b>Immediate learning feedback</b><p>${fb}</p></div><div class="buttonrow"><button class="btn primary" onclick="go('quiz')">Continue to check →</button></div><button class="btn" style="margin-top:10px" onclick="askCoach()">Ask AI Coach for a hint</button><div id="coachResult" aria-live="polite"></div>`;persist()}
async function askCoach(){const elem=document.getElementById('coachResult');elem.innerHTML='<p class="stepnote">Checking for tutor response…</p>';const payload={topic:'simple pendulum',learner:'anxious class 9 repeat learner',answer:state.reflection,experiment:{length:state.length,mass:state.mass,amplitude:state.amplitude,period:period(state.length)},misconceptions:['heavier bob swings faster','longer string means shorter period']};try{const res=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!res.ok)throw Error('unavailable');const data=await res.json();if(!data||typeof data.feedback!=='string'||data.feedback.length>500)throw Error('invalid');elem.innerHTML=`<div class="feedback"><b>${data.mode==='live'?'AI-generated hint (checked)':'Recorded fallback hint (AI unavailable)'}</b><p>${html(data.feedback)}</p></div>`;log('coach',data.mode||'fallback')}catch{elem.innerHTML='<div class="feedback"><b>Recorded fallback hint (AI unavailable)</b><p>Try changing only one variable. Does the mass slider change the period? What about length? Revise your explanation using that observation.</p></div>';log('coach','fallback')}}
const QUIZ=[{type:'choice',q:'A pendulum is made longer. What happens to its period?',options:['It increases','It decreases','It stays the same'],answer:0,why:'Longer strings increase the time needed for each oscillation.',mis:'If you chose shorter or unchanged, compare two lengths in the lab. More length means more time per swing.'},{type:'choice',q:'If you double the bob mass while keeping length fixed, what happens?',options:['Period becomes twice as long','Period becomes shorter','Period stays the same'],answer:2,why:'Mass cancels out for an ideal simple pendulum.',mis:'A heavier bob may feel different to hold, but it does not change the ideal pendulum period.'},{type:'number',q:'Approximately what is the period in seconds at L = 1 m? (Enter to 1 decimal place.)',answer:2.0,why:'T = 2π√(1/9.81) ≈ 2.01 s.',mis:'Calculate the period of one full oscillation, not half a swing.'},{type:'choice',q:'Which is the fairest way to test the effect of length?',options:['Change length and mass together','Change only length; keep mass and angle fixed','Change everything together'],answer:1,why:'A fair experiment changes one independent variable at a time.',mis:'Changing multiple variables together makes it hard to identify the cause.'},{type:'text',q:'A friend says “A heavier bob always swings faster.” Explain whether that is correct.',answer:'mass',why:'In an ideal pendulum, period is independent of mass. With fixed length and a small angle, both bobs take the same time.',mis:'Use the mass slider with length fixed. Does the value of T change? Explain the result.'}];
function quiz(){if(state.quizIndex>=QUIZ.length)return finish();let q=QUIZ[state.quizIndex], old=state.quizAnswers[state.quizIndex];return `<div class="kicker">5 · Check your understanding</div><h2>Question ${state.quizIndex+1} of ${QUIZ.length}</h2><div class="bar"><b style="width:${(state.quizIndex/QUIZ.length)*100}%"></b></div><p class="question">${html(q.q)}</p>${q.type==='choice'?`<div class="options">${q.options.map((o,i)=>`<button class="option ${old&&String(old.value)===String(i)?'selected':''}" onclick="submitQuiz('${i}')">${html(o)}</button>`).join('')}</div>`:q.type==='number'?`<input id="qInput" type="number" step="0.1" placeholder="e.g. 2.0" aria-label="Your answer">`:`<textarea id="qInput" placeholder="Explain using your observation..."></textarea>`}<div id="qFeedback">${old?quizFB(q,old):''}</div><div class="buttonrow"><button class="btn" onclick="go('reflect')">← Review lab</button>${q.type!=='choice'&&!old?'<button class="btn primary" onclick="submitInput()">Check answer</button>':''}${old?`<button class="btn primary" onclick="nextQuiz()">${state.quizIndex===4?'Finish':'Next question'} →</button>`:''}</div>`}
function quizFB(q,a){return `<div class="feedback ${a.correct?'':'wrong'}"><b>${a.correct?'Well done!':'Useful attempt — try this hint'}</b><p>${html(a.correct?q.why:q.mis)}</p>${!a.correct?'<p>You can return to the lab, test this idea, and then continue.</p>':''}</div>`}
function submitInput(){let v=document.getElementById('qInput').value.trim();if(v.length===0)return;submitQuiz(v)}
function submitQuiz(value){let q=QUIZ[state.quizIndex];if(state.quizAnswers[state.quizIndex])return;let good=q.type==='choice'?Number(value)===q.answer:q.type==='number'?Number.isFinite(Number(value))&&Math.abs(Number(value)-q.answer)<=.15:/mass|weight|bob|heavy/i.test(value)&&/not|no |same|independent|doesn.t|unchanged|equal/i.test(value);state.quizAnswers[state.quizIndex]={value,correct:good};log('quiz_answer',JSON.stringify({q:state.quizIndex,correct:good,value}));render()}
function nextQuiz(){state.quizIndex++;if(state.quizIndex>=QUIZ.length)go('finish');else render()}
function finish(){let score=state.quizAnswers.filter(a=>a.correct).length;return `<div class="kicker">6 · Reflection and progress</div><h1>You've learned by experimenting!</h1><div class="grid"><div class="box good"><small>Assessment score</small><div class="stat">${score} / ${QUIZ.length}</div><p>Your questions show what to practise next, not your ability as a learner.</p></div><div class="box"><small>Experiments performed</small><div class="stat">${state.trials}</div><p>Each attempt is evidence. Changing one variable at a time helps you learn more.</p></div></div><h3>Key discoveries</h3><ul><li>Longer string → longer period.</li><li>Changing mass → no change in ideal period.</li><li>At small angles, amplitude has little effect on period; the formula is an approximation.</li><li>A wrong prediction is a reason to revise a hypothesis, not give up.</li></ul><div class="buttonrow"><button class="btn primary" onclick="restart()">Try a fresh experiment ↻</button><button class="btn" onclick="downloadLog()">Download learning log</button></div><p class="stepnote">Success goal: ≥ 4/5 on assessment and an explanation based on experimental observations.</p>`}
function restart(){state.prediction='';state.result=null;state.reflection='';state.quizIndex=0;state.quizAnswers=[];state.feedback=null;go('predict')}
function downloadLog(){const blob=new Blob([JSON.stringify({identity:'23B3988',card:'P5-T1-L5-C3',log:state.logs,quiz:state.quizAnswers,reflection:state.reflection},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pendulum-learning-log-23B3988.json';a.click();URL.revokeObjectURL(a.href)}
function about(){return `<div class="kicker">About this learning tool</div><h2>Pendulum Explorer</h2><div class="box"><p><b>Identity:</b> 23B3988</p><p><b>Exam card:</b> P5 · Inquiry-based virtual laboratory / T1 · Simple pendulum / L5 · Anxious repeat learner / C3 · Mobile-first one-handed</p><p><b>Learning purpose:</b> Predict, manipulate variables, observe results, compare evidence and revise hypotheses.</p><p><b>Model:</b> T=2π√(L/g), g=9.81 m/s², small-angle approximation. The animation uses that model; real motion can differ due to friction and large amplitudes.</p><p><b>AI disclosure:</b> The optional coach calls a server-side API. Without a configured AI key, a labelled recorded-feedback fallback is used. Core simulations and quizzes are deterministic, not AI-generated.</p><p><b>Accessibility:</b> Large tap targets, labelled sliders, text feedback and keyboard-accessible controls.</p></div><div class="buttonrow"><button class="btn primary" onclick="go('welcome')">Back to home</button></div>`}
render();
</script></body></html>
